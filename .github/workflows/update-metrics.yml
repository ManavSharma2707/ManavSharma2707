name: Update metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "design/tokens.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: npm run fetch-metrics

      - name: Render SVG panels
        run: npm run render-svgs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh metrics"
          git push
