name: Generate snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg?color_snake=#C9A54A&color_dots=#E9E7E1,#BFE3E6,#6FC4CC,#0E7C86,#C9A54A
            assets/generated/snake-dark.svg?color_snake=#E8CD7E&color_dots=#1A1F26,#134A52,#1C7E88,#35D6E8,#E8CD7E

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/snake.svg assets/generated/snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution snake"
          git pull --rebase origin main
          git push
